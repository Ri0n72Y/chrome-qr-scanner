name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock=false
      - run: npm run check
      - run: npm run build
      - name: Verify extension output
        run: |
          test -f dist/manifest.json
          test -f dist/popup.html
          test -f dist/popup.css
          test -f dist/popup.js
